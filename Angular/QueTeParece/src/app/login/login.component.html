
<main>
    <section class="form-container-login-register">
        <section class="text-and-logo"></section>
        <h1 id="title-login-register">L o g i n</h1>

        <form id="form-style" class="login-form" (ngSubmit)="login()">
            <section class="text-input">
                <label for="email">Email</label><br>
                <input type="email" id="email" [(ngModel)]="email" name="email"><br>
            </section>
            <section class="text-input">
                <label for="password">Contraseña</label><br>
                <input type="password" id="password" [(ngModel)]="password" name="Contraseña"><br>
            </section>
            <p id="forgot-password">¿Olvidaste tu contraseña?</p>
            <section class="buttons-type-login">
                <input id="oval-button" type="submit" value="Iniciar Sesión">
                <a routerLink="/register">Registrarse</a>
            </section>
        </form>

    </section>
</main>
