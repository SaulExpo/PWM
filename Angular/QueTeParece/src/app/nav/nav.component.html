<nav id="nav" class="container">
  <div class="left-text">
    <a href="/films?name=film"><p>Peliculas</p></a>
    <a href="/films?name=serie"><p>Series</p></a>
    <a href="/films"><p>Todo</p></a>
  </div>
    <div class="search-bar">
        <!-- Input para la búsqueda -->
        <input #searchInput
               type="text"
               placeholder="Buscar película..."
               (input)="onSearch(searchInput.value)"
               (blur)="onBlur()"
               (focus)="onFocus()">

        <!-- Sugerencias de búsqueda -->
        <div id="suggestions" *ngIf="filteredfilms.length > 0 && suggestionsVisible" >
            <div class="suggestion-item" *ngFor="let film of filteredfilms">
                <a [routerLink]="['/filmInfo']" [queryParams]="{ id: film.Id }">
                <img [src]="film.CoverUrl" alt="cover">
                <div>{{ film.Title }}</div>
                </a>
            </div>
        </div>
    </div>

    <div class="right-text"></div>
</nav>
