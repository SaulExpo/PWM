<main>
    <article id ="category" #userNameDiv>
        <!-- Usa *ngFor para iterar sobre los elementos 'films' -->
        <ul>
            <li *ngFor="let film of films">
                {{ film.Category }} - {{ film.Title }}
                <img [src]="film.CoverUrl" alt="">
            </li>
        </ul>
    </article>
</main>
