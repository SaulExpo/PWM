
<main>
<section class="form-container-login-register">
    <h1 id="title-login-register">R e g i s t e r</h1>

    <form id="form-style" class="register-form" (ngSubmit)="register()">
        <section class="text-input">
            <label for="name">Nombre</label><br>
            <input type="text" id="name" [(ngModel)]="name" name="Nombre"><br>
            <span id="nameError" class="error-message"></span>
        </section>
        <section class="text-input">
            <label for="surname">Apellido</label><br>
            <input type="text" id="surname" [(ngModel)]="surname" name="Apellido"><br>
            <span id="surnameError" class="error-message"></span>
        </section>
        <section class="text-input">
            <label for="email">email</label><br>
            <input type="email" id="email" [(ngModel)]="email" name="email"><br>
            <span id="emailError" class="error-message"></span>
        </section>
        <section class="text-input">
            <label for="password">Contraseña</label><br>
            <input type="password" id="password" [(ngModel)]="password" name="Contraseña"><br>
            <span id="passwordError" class="error-message"></span>
        </section>
        <section class="buttons-type-login">
            <input id="oval-button" type="submit" value="Registrarse">
            <a routerLink ="/">Cancelar</a>
        </section>
    </form>
</section>
</main>
