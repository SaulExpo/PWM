
<main>
    <article id="film" class ="film_container">
        <h2 id="film_title" *ngIf="filmData">{{ filmData.Title }}</h2>
        <img id="film-image" *ngIf="filmData" [src]="filmData.CoverUrl" alt="Cover Image" />
        <p *ngIf="filmData">{{ filmData.Descripcion }}</p>

    </article>
    <div id="Actores"></div>
    <div id="personal-review-container">
        <article class ="personal-review write"></article>
    </div>
    <article id="review-container"></article>
</main>
