<ion-content>
<app-header></app-header>
  <app-navigation></app-navigation>
  <main>
    <article id ="category" #userNameDiv>
      <a class="category-button" href="films.html"><h1 class="image-and-text-h1">Animation</h1></a>
      <article class="c-right-arrow">
        <div class="images">
          <section class="image-title" *ngFor="let film of AnimationFilms">
            <a [routerLink]="['/filmInfo']" [queryParams]="{ id: film.Id }" (click)="filmRedirect(film.Id)"><img [src]="film.CoverUrl" width="150" height="150"></a>
            <p>{{ film.Title }}</p>
          </section>
        </div>
        <section class="t-button-right">
          <button id="triangular-button-right" #buttonRef></button>
        </section>
      </article>
      <a class="category-button" href="films.html"><h1 class="image-and-text-h1">Live-Action</h1></a>
      <article class="c-right-arrow">
        <div class="images">
          <section class="image-title" *ngFor="let film of LiveFilms">
            <a [routerLink]="['/filmInfo']" [queryParams]="{ id: film.Id }"><img [src]="film.CoverUrl" width="150" height="150"></a>
            <p>{{ film.Title }}</p>
          </section>
        </div>
        <section class="t-button-right">
          <button id="triangular-button-right" #buttonRef></button>
        </section>
      </article>
    </article>
  </main>
<app-footer></app-footer>
</ion-content>
