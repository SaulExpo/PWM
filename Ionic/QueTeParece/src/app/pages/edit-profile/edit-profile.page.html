<ion-content>
  <app-header></app-header>
  <app-navigation></app-navigation>

<main>
  <section id="main-container">
    <aside id="aside-text">
      <section class="profile-image image-title"></section>
    </aside>
    <section id="main-section">
      <form id="form-style" (ngSubmit)="onSubmit($event)">
        <section class="text-input">
          <label for="name">Nombre</label><br>
          <input type="text" id="name" name="Nombre" [(ngModel)]="user.name"><br>
        </section>
        <section class="text-input">
          <label for="surname">Apellido</label><br>
          <input type="text" id="surname" name="Apellido" [(ngModel)]="user.surname"><br>
        </section>
        <section class="text-input">
          <label for="password">Contraseña</label><br>
          <input type="password" id="password" name="Contraseña" [(ngModel)]="user.password"><br>
        </section>
        <section class="buttons-type-edit-profile">
          <a id="grey-button" (click)="profileRedirect('')">Cancelar</a>
          <input id="oval-button" (click)="profileRedirect('profile')" type="submit" value="Editar">
        </section>
      </form>
    </section>
  </section>
</main>

  <footer id="footer"></footer>
  <app-footer></app-footer>
</ion-content>
