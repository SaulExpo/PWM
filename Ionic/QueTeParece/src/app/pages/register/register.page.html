<link href="https://fonts.cdnfonts.com/css/arcade-classic" rel="stylesheet">
<ion-content>
  <main>
    <section class="form-container-login-register">
      <h1 id="title-login-register">R e g i s t e r</h1>

      <form #registerForm="ngForm" id="form-style" class="register-form" (ngSubmit)="register()">

        <section class="text-input">
          <label for="name">Nombre</label><br>
          <input required type="text" id="name" [(ngModel)]="name" name="name" #nameRef="ngModel"><br>
          <span class="error-message" *ngIf="nameRef.invalid && nameRef.touched">El nombre es requerido</span>
        </section>

        <section class="text-input">
          <label for="surname">Apellido</label><br>
          <input type="text" id="surname" [(ngModel)]="surname" name="surname"><br>
        </section>

        <section class="text-input">
          <label for="email">Email</label><br>
          <input required type="email" id="email" [(ngModel)]="email" name="email" #emailRef="ngModel"><br>
          <span class="error-message" *ngIf="emailRef.invalid && emailRef.touched">Ingresa un email válido</span>
        </section>

        <section class="text-input">
          <label for="password">Contraseña</label><br>
          <input required minlength="6" type="password" id="password" [(ngModel)]="password" name="password" #passwordRef="ngModel"><br>
          <span class="error-message" *ngIf="passwordRef.errors?.['required'] && passwordRef.touched">La contraseña es requerida</span>
          <span class="error-message" *ngIf="passwordRef.errors?.['minlength'] && passwordRef.touched">La contraseña debe tener al menos 6 caracteres</span>
        </section>

        <section class="buttons-type-login">
          <input id="oval-button" type="submit" value="Registrarse" [disabled]="registerForm.invalid">
          <a routerLink="/" (click)="homeRedirect()" id="cancelar">Cancelar</a>
        </section>
      </form>

    </section>
  </main>
</ion-content>
